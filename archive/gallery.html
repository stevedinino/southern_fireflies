<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery – Southern Fireflies Retreats</title>
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="styles/layout.css" />
</head>
<body class="gallery-page">
  <header>
    <div class="nav-wrapper">
      <button class="menu-toggle" aria-label="Toggle menu">☰</button>
      <nav class="main-nav">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="merch.php">Merch</a></li>
          <li><a href="cancellation.html">Our Policies</a></li>
          <li><a href="gallery.html" aria-current="page">Gallery</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="content-wrapper">
    <div class="page-container">
      <h1>Gallery</h1>
      <p class="gallery-intro">Click any image to view it full size.</p>

      <div id="gallery-status" class="gallery-status">Loading gallery...</div>
      <div id="gallery-grid" class="gallery-grid" aria-live="polite"></div>
    </div>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button
      id="lightbox-close"
      class="lightbox-close"
      type="button"
      aria-label="Close image view"
    >
      ×
    </button>
    <img id="lightbox-image" class="lightbox-image" alt="" />
  </div>

  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const navLinks = document.querySelector('.nav-links');

    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('show');
    });

    const galleryGrid = document.getElementById('gallery-grid');
    const galleryStatus = document.getElementById('gallery-status');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const lightboxClose = document.getElementById('lightbox-close');

    /* Replace these with your real filenames in ./gallery */
    const imageFiles = [
      'gallery/IMG_0124.jpeg',
      'gallery/IMG_0126.jpeg',
      'gallery/IMG_0131.jpeg',
      'gallery/IMG_0134.jpeg',
      'gallery/IMG_0636.jpg',
      'gallery/IMG_0637.jpg',
      'gallery/IMG_0638.jpg',
      'gallery/IMG_0639.jpg',
      'gallery/IMG_0650.jpg',
      'gallery/IMG_0651.jpg',
      'gallery/IMG_0652.jpg',
      'gallery/IMG_0653.jpg',
      'gallery/IMG_0654.jpg',
      'gallery/IMG_0655.jpg',
      'gallery/IMG_0665.jpg',
      'gallery/IMG_0666.jpg'
    ];

    function openLightbox(src, altText) {
      lightboxImage.src = src;
      lightboxImage.alt = altText || 'Gallery image';
      lightbox.hidden = false;
      document.body.classList.add('lightbox-open');
    }

    function closeLightbox() {
      lightbox.hidden = true;
      lightboxImage.src = '';
      lightboxImage.alt = '';
      document.body.classList.remove('lightbox-open');
    }

    lightboxClose.addEventListener('click', closeLightbox);

    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !lightbox.hidden) {
        closeLightbox();
      }
    });

    function loadGallery() {
      if (!imageFiles.length) {
        galleryStatus.textContent = 'No images were found.';
        return;
      }

      galleryStatus.hidden = true;

      imageFiles.forEach((src, index) => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'gallery-item';
        item.setAttribute('aria-label', `Open image ${index + 1}`);

        const image = document.createElement('img');
        image.src = src;
        image.alt = `Gallery image ${index + 1}`;
        image.className = 'gallery-thumb';
        image.loading = 'lazy';

        item.appendChild(image);
        item.addEventListener('click', () => openLightbox(src, image.alt));
        galleryGrid.appendChild(item);
      });
    }

    loadGallery();
  </script>
</body>
</html>
