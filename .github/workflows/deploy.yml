name: Deploy to Network Solutions

# Runs every time a commit lands on main (i.e. every time a PR is merged
# or you push directly to main). Change the branch name below if your
# default branch is called something else.
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Sync files over SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          protocol: sftp # change to "ftps" or "sftp" - see note below

          # Where in the repo the site lives (root of this repo) and
          # where it lands on the server. Adjust server-dir after you've
          # confirmed the real folder name by connecting with FileZilla
          # first (see the setup guide) - it's often the account root,
          # sometimes "public_html/" or "httpdocs/".
          local-dir: ./
          server-dir: ./

          # NEVER remove server files that aren't in this repo. config.php,
          # the *.csv data files, the *_counter.txt files, login_throttle.json
          # and everything under backups/ live ONLY on the server (they're
          # gitignored on purpose) and must survive every deploy.
          dangerous-clean-slate: false

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/config.php
            **/merchandise.csv
            **/merchandise_archive.csv
            **/registrations.csv
            **/merchandise_orderid_counter.txt
            **/registrations_regid_counter.txt
            **/login_throttle.json
            **/backups/**
